name: Portfolio Quality Gate

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Code, DOM & Claim Integrity Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements*.txt'
        continue-on-error: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pypdf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Python Bytecode Compilation
        run: |
          python -m compileall scripts tests

      - name: 2. JavaScript Syntax Validation
        run: |
          node --check script.js
          node --check tests/test_interactive.js

      - name: 3. Claim Normalization & Fixture Regression Suite
        run: |
          python tests/test_claim_normalization.py

      - name: 4. Static DOM, Links, Heading & Claims Integrity Audit
        run: |
          python tests/test_links.py
